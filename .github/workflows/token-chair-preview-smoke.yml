name: Token Chair Preview Smoke

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Vercel Preview URL to smoke-test"
        required: true
        type: string
      owner_address:
        description: "Optional owner address for approval API config checks"
        required: false
        default: "0x1111111111111111111111111111111111111111"
        type: string

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke Vercel preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run smoke:preview -- "${{ inputs.preview_url }}" "${{ inputs.owner_address }}"
