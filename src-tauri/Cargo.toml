[package]
name = "pulse-revoke"
version = "0.1.0"
edition = "2021"

[lib]
name = "pulse_revoke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pulse-revoke-server"
path = "src/server_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
include_dir = "0.7"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
